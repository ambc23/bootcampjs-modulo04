<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div id="app">
      <div class="turno-display">
        <h1 class="numero-turno" id="turnoActual">01</h1>
        <p class="texto-turno">Por favor, acérquese al mostrador</p>
      </div>

      <div>
        <button id="anterior">Anterior</button>
        <button id="siguiente">Siguiente</button>
        <button id="reset">Reset</button>
      </div>

      <p id="avisoTurno" style="display: none;">Turno mínimo</p>
      
      <div class="bloqueModificar">
        <p>Modificar turno</p>
        <input type="number" id="turnoManual" min="1">
        <button id="cambiar">Cambiar</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
